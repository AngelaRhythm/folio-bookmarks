<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Folio</title>
  <link rel="stylesheet" href="styles/folio.css" />
</head>
<body>
  <!-- Shared SVG definitions for Nucleo Glass icons using perceptually uniform OKLCH palette -->
  <svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden;" aria-hidden="true">
    <defs>
      <linearGradient id="ng-cobalt" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--ok-indigo-hi)" />
        <stop offset="100%" stop-color="var(--ok-indigo-lo)" />
      </linearGradient>
      <linearGradient id="ng-work" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--ok-blue-hi)" />
        <stop offset="100%" stop-color="var(--ok-blue-lo)" />
      </linearGradient>
      <linearGradient id="ng-slate" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--ok-teal-hi)" />
        <stop offset="100%" stop-color="var(--ok-teal-lo)" />
      </linearGradient>
      <linearGradient id="ng-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--ok-neutral-hi)" />
        <stop offset="100%" stop-color="var(--ok-neutral-lo)" />
      </linearGradient>
      <linearGradient id="ng-amber" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--ok-amber-hi)" />
        <stop offset="100%" stop-color="var(--ok-amber-lo)" />
      </linearGradient>
      <linearGradient id="ng-violet" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--ok-violet-hi)" />
        <stop offset="100%" stop-color="var(--ok-violet-lo)" />
      </linearGradient>
      <linearGradient id="ng-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--ok-emerald-hi)" />
        <stop offset="100%" stop-color="var(--ok-emerald-lo)" />
      </linearGradient>
      <linearGradient id="ng-rose" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--ok-rose-hi)" />
        <stop offset="100%" stop-color="var(--ok-rose-lo)" />
      </linearGradient>
      <linearGradient id="ng-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--ok-cyan-hi)" />
        <stop offset="100%" stop-color="var(--ok-cyan-lo)" />
      </linearGradient>
      <linearGradient id="ng-glass-pane" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--glass-hi)" stop-opacity="0.74" />
        <stop offset="100%" stop-color="var(--glass-lo)" stop-opacity="0.32" />
      </linearGradient>
      <linearGradient id="ng-glass-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--glass-rim-hi)" stop-opacity="0.72" />
        <stop offset="100%" stop-color="var(--glass-rim-lo)" stop-opacity="0.14" />
      </linearGradient>
    </defs>
  </svg>

  <div id="app" class="app-shell">
    <!-- Mobile backdrop for drawer sidebar -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Ultra-slim collapsible left sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="书签文件夹导航">
      <div class="sidebar-top">
        <a href="#all" class="brand-link" id="brand-home" aria-label="回到全部书签">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-wordmark">Folio</span>
        </a>
        <button type="button" id="btn-collapse-sidebar" class="icon-btn sidebar-toggle" aria-label="收起或展开侧边栏">
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav" aria-label="文件夹目录">
        <!-- Populated dynamically -->
      </nav>

      <!-- Interactive Isometric Background Boxes (Aceternity UI style) -->
      <div id="sidebar-bg-boxes" class="sidebar-boxes" aria-hidden="true">
        <div id="sidebar-boxes-grid" class="sidebar-boxes-grid"></div>
        <div class="sidebar-boxes-fade" aria-hidden="true"></div>
      </div>
    </aside>

    <!-- Main Gallery Workspace -->
    <main id="workspace" class="workspace">
      <header id="topbar" class="topbar">
        <div class="topbar-left">
          <button type="button" id="btn-mobile-menu" class="icon-btn mobile-menu-btn" aria-label="打开文件夹菜单"></button>
          <button type="button" id="btn-topbar-search" class="search-trigger" aria-label="搜索书签">
            <span class="search-trigger-icon" id="icon-topbar-search"></span>
            <span class="search-trigger-text">搜索书签、网址或文件夹...</span>
            <span class="search-trigger-key">⌘K</span>
          </button>
        </div>

        <div class="topbar-controls">
          <button type="button" id="btn-open-tidy" class="topbar-action-btn" aria-label="打开或收起设置" aria-expanded="false">
            <span class="topbar-action-icon" id="icon-topbar-settings"></span>
          </button>
        </div>
      </header>

      <!-- Live Batch Capture Progress Strip -->
      <div id="batch-banner" class="batch-banner" hidden>
        <div class="batch-banner-info">
          <span class="batch-spinner" aria-hidden="true"></span>
          <span id="batch-banner-text" class="batch-banner-text">正在补采首屏...</span>
        </div>
        <div class="batch-banner-right">
          <div class="batch-bar-track">
            <div id="batch-bar-fill" class="batch-bar-fill"></div>
          </div>
          <button type="button" id="btn-stop-batch" class="text-action">停止</button>
        </div>
      </div>

      <!-- Optional Subfolder Strip when viewing a parent folder with nested subfolders -->
      <div id="subfolder-bar" class="subfolder-bar" hidden></div>

      <!-- Gallery Canvas -->
      <div id="gallery-root" class="gallery-root" aria-live="polite"></div>

      <!-- Minimalist End-of-Gallery Colophon Footer (Aceternity watermark style) -->
      <footer id="gallery-footer" class="gallery-footer" aria-label="页面底部">
        <span class="footer-watermark" aria-hidden="true">FOLIO</span>
        <div class="footer-inner">
          <button type="button" id="btn-back-to-top" class="footer-top-btn" aria-label="回到页面顶部">
            <span class="footer-top-icon" id="icon-footer-top"></span>
          </button>
        </div>
      </footer>
    </main>

    <!-- Right Split-Pane Settings Panel (compresses workspace when open) -->
    <aside id="settings-pane" class="settings-pane" aria-label="设置" aria-hidden="true">
      <div class="settings-pane-inner">
        <div class="drawer-header">
          <h2 class="drawer-title">设置</h2>
          <button type="button" id="btn-close-tidy" class="icon-btn" aria-label="收起设置面板"></button>
        </div>

        <div class="drawer-tabs-wrap">
          <div id="tidy-tabs" class="segmented-control segmented-full" role="tablist">
            <span class="segmented-thumb" aria-hidden="true"></span>
            <button type="button" role="tab" class="segmented-option" data-tab="settings" aria-selected="true">常规设置</button>
            <button type="button" role="tab" class="segmented-option" data-tab="health" aria-selected="false">书签体检</button>
          </div>
        </div>

        <div id="tidy-content" class="drawer-body"></div>
      </div>
    </aside>
  </div>

  <!-- First-Time Local Sync Welcome Modal -->
  <div id="onboarding-overlay" class="modal-overlay modal-centered" hidden aria-hidden="true">
    <div class="onboarding-dialog" role="dialog" aria-modal="true" aria-labelledby="onboarding-title">
      <div class="onboarding-mark" id="onboarding-mark" aria-hidden="true"></div>
      <h2 id="onboarding-title" class="onboarding-title">已关联你的书签文件夹</h2>
      <p id="onboarding-desc" class="onboarding-desc"></p>
      <div class="onboarding-actions">
        <button type="button" id="btn-onboarding-start" class="primary-action onboarding-primary">开始使用</button>
      </div>
    </div>
  </div>

  <!-- Spotlight Search Overlay -->
  <div id="spotlight-overlay" class="modal-overlay" hidden aria-hidden="true">
    <div class="spotlight-dialog" role="dialog" aria-modal="true" aria-label="搜索书签">
      <div class="spotlight-input-row">
        <span class="spotlight-icon" id="icon-spotlight-search"></span>
        <input
          type="text"
          id="spotlight-input"
          class="spotlight-input"
          placeholder="输入标题、网址或文件夹名称..."
          autocomplete="off"
          spellcheck="false"
        />
        <span class="spotlight-esc">Esc</span>
      </div>
      <div id="spotlight-results" class="spotlight-results" role="listbox"></div>
    </div>
  </div>

  <!-- Floating Move-to-Folder Popover -->
  <div id="move-popover" class="move-popover" hidden role="menu" aria-label="移动到文件夹"></div>

  <!-- Card Right-Click Context Menu -->
  <div id="card-context-menu" class="context-menu" hidden role="menu" aria-label="书签操作">
    <button type="button" class="context-menu-item" data-ctx-action="open-tab" role="menuitem">
      <span class="context-menu-icon" id="icon-ctx-tab"></span>
      <span>在新标签页中打开</span>
    </button>
    <button type="button" class="context-menu-item" data-ctx-action="open-window" role="menuitem">
      <span class="context-menu-icon" id="icon-ctx-window"></span>
      <span>在新窗口中打开</span>
    </button>
    <button type="button" class="context-menu-item" data-ctx-action="open-split" role="menuitem">
      <span class="context-menu-icon" id="icon-ctx-split"></span>
      <span>在拆分视图中打开</span>
    </button>
    <button type="button" class="context-menu-item" data-ctx-action="open-incognito" role="menuitem">
      <span class="context-menu-icon" id="icon-ctx-incognito"></span>
      <span>在隐身窗口中打开</span>
    </button>
    <div class="context-menu-divider" role="separator"></div>
    <button type="button" class="context-menu-item" data-ctx-action="edit" role="menuitem">
      <span class="context-menu-icon" id="icon-ctx-edit"></span>
      <span>修改...</span>
    </button>
    <div class="context-menu-divider" role="separator"></div>
    <button type="button" id="ctx-remove-bookmark" class="context-menu-item is-danger" data-ctx-action="remove" role="menuitem">
      <span class="context-menu-icon" id="icon-ctx-trash"></span>
      <span>移除书签</span>
    </button>
  </div>

  <!-- Minimal Edit Bookmark Modal (Name & URL only) -->
  <div id="edit-bookmark-overlay" class="modal-overlay modal-centered" hidden aria-hidden="true">
    <form id="edit-bookmark-form" class="edit-dialog" role="dialog" aria-modal="true" aria-labelledby="edit-bookmark-title" novalidate>
      <h2 id="edit-bookmark-title" class="edit-dialog-title">修改书签</h2>
      <div class="edit-dialog-fields">
        <label class="edit-field-row" for="edit-bm-title">
          <span class="edit-field-label">名称</span>
          <input type="text" id="edit-bm-title" class="edit-field-input" autocomplete="off" spellcheck="false" />
        </label>
        <label class="edit-field-row" for="edit-bm-url">
          <span class="edit-field-label">网址</span>
          <input type="url" id="edit-bm-url" class="edit-field-input" autocomplete="off" spellcheck="false" />
        </label>
        <p id="edit-bm-error" class="edit-field-error" hidden></p>
      </div>
      <div class="edit-dialog-actions">
        <button type="button" id="btn-edit-bm-cancel" class="btn-subtle edit-dialog-btn">取消</button>
        <button type="submit" id="btn-edit-bm-save" class="primary-action edit-dialog-btn">保存</button>
      </div>
    </form>
  </div>

  <!-- Subtle Floating Tooltip for Collapsed Rail -->
  <div id="rail-tooltip" class="rail-tooltip" hidden aria-hidden="true"></div>

  <!-- Subtle Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
